<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q3 narrow viewport wrapper</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: auto; background: #151515; color: #eee; font: 12px system-ui, sans-serif; }
  #stage { box-sizing: border-box; width: max-content; min-width: 100%; min-height: 100%; padding: 24px; }
  #game-frame { display: block; box-sizing: content-box; width: var(--frame-width, 390px); height: var(--frame-height, 844px); border: 0; margin: 0; padding: 0; background: #000; }
  #q3-meta { position: fixed; z-index: 2; top: 4px; right: 6px; padding: 2px 5px; background: #222d; pointer-events: none; }
</style>
</head>
<body>
<div id="q3-meta" aria-hidden="true">Q3 staging viewport wrapper</div>
<main id="stage"><iframe id="game-frame" title="Plush Rescue game viewport" allow="fullscreen"></iframe></main>
<script src="/tools/firefox-q3/narrow/q3_narrow_wrapper.js"></script>
</body>
</html>
