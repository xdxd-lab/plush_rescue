# Branch-only diagnostic; both jobs call the same implementation that a later
# Pages gate would call. Neither job deploys or changes the existing gate.
name: Q2 Linux Chrome diagnostic

on:
  push:
    branches: [ci/chrome-q2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-matrix:
    uses: ./.github/workflows/chrome-q2-shared.yml
    with:
      matrix_runs: 1
  repeat-matrix:
    uses: ./.github/workflows/chrome-q2-shared.yml
    with:
      matrix_runs: 2
