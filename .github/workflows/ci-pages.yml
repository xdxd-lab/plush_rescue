# CI for every push and PR; Pages only for a push to main after tests, Q2 and V3 pass.
# As of v12.4.1 (3af4239), Settings → Pages → Source is "GitHub Actions" and this gate is active.
# Keep that setting: switching back to branch deployment bypasses this workflow gate (see README.md).
name: CI and Pages

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# At most one run per ref at a time: on main the whole test → build → deploy chain of one run
# finishes before another run of this workflow on main starts, and a run in progress is never
# cancelled midway (a newer pending run may replace an older pending one). The order in which
# pending runs start is not relied on: a late or re-run older run is stopped by the freshness
# check in deploy-pages. Pull requests (refs/pull/N/merge) and other branches get their own groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify export (hashes, references, JS syntax)
        run: python3 verify-export.py
      - name: Node tests
        run: node --test qa/*.test.mjs
      - name: UI smoke
        run: node qa/ui-smoke.mjs

  # Use the same verified Chrome workflow and dependencies as the branch diagnostic.
  chrome-smoke:
    needs: test
    uses: ./.github/workflows/chrome-q2-shared.yml
    with:
      matrix_runs: 1

  # Independent V3 evidence; Q2's command, budget and result contract are unchanged.
  v3-ui:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Identify Chrome and install CJK font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v3-artifacts
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version | tee v3-artifacts/chrome-version.txt
          node --version | tee v3-artifacts/node-version.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          version="$(dpkg-query -W -f='${Version}' fonts-noto-cjk)"
          test -n "$version"
          fc-match -f '%{family}\n%{file}\n' 'Noto Sans CJK TC:lang=zh-tw' > v3-artifacts/font-match.txt
          printf 'fonts-noto-cjk %s\n' "$version" > v3-artifacts/font-package.txt
          echo "V3_FONT_STATUS=installed" >> "$GITHUB_ENV"
          echo "V3_FONT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Run one bounded V3 UI matrix
        run: node qa/v3-ci-runner.mjs --output=v3-artifacts/run
      - name: Upload original V3 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: v3-artifacts/
          if-no-files-found: error
          retention-days: 14

  # Packs the same commit only after all independent checks pass.
  build-pages:
    needs: [test, chrome-smoke, v3-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/configure-pages@v6
      # The whole repository root, as the branch deployment serves it; include-hidden-files keeps
      # .nojekyll (.git and .github are always excluded by the action).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  deploy-pages:
    needs: build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # freshness check reads refs/heads/main
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy only while main still points at this run's commit, so a stale run (started late or
      # re-run) never replaces a newer deployment. Runs in the same serialized run as the deploy;
      # if main cannot be read, the step fails and nothing is deployed.
      - id: fresh
        name: Check that main is still this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read refs/heads/main ($head)"; exit 1; }
          if [ "$head" = "$RUN_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not $RUN_SHA: skipping stale deployment"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.fresh.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
